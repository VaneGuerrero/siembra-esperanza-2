<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073f49">
<title>Isola 10 Aniversario · Grabador de vídeo</title>
<style>
  :root {
    --blue:#073f49; --mid:#146b72; --gold:#f0b323; --ink:#123f45;
    --green:#329b43; --paper:#fffdf8; --muted:#60777a;
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; }
  body {
    min-height:100dvh; color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:12px; padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 20px);
    background:
      radial-gradient(ellipse at -8% 8%, rgba(7,63,73,.11) 0 12%, transparent 12.3%),
      radial-gradient(ellipse at 108% 34%, rgba(240,179,35,.16) 0 13%, transparent 13.3%),
      radial-gradient(ellipse at 4% 100%, rgba(50,155,67,.12) 0 16%, transparent 16.3%),
      linear-gradient(150deg,#f4f8f6 0%,#fff 48%,#f8f5e9 100%);
    overflow-x:hidden;
  }
  .brand {
    width:min(100%,430px); display:flex; align-items:center; justify-content:center;
    gap:10px; color:var(--blue); margin-bottom:1px;
  }
  .brand-mark {
    width:37px;height:37px;border-radius:50% 50% 50% 12%;
    background:conic-gradient(from 25deg,var(--green) 0 24%,var(--gold) 24% 42%,var(--blue) 42% 68%,#8abf39 68% 84%,var(--green) 84%);
    border:2px solid rgba(7,63,73,.12); flex:none; position:relative;
  }
  .brand-mark:after { content:""; position:absolute; inset:7px; border:1.5px solid rgba(255,255,255,.85); border-radius:50%; }
  .brand-copy { line-height:1.02; }
  .brand-name { font-size:1.22rem; letter-spacing:.06em; font-weight:950; }
  .brand-sub { font-size:.69rem; color:var(--green); font-weight:900; letter-spacing:.18em; margin-top:4px; }
  h1 { font-size:clamp(1.1rem,4vw,1.42rem); margin:0; text-align:center; font-weight:900; color:var(--blue); letter-spacing:-.025em; }
  h1.brand-logo { line-height:0; }
  h1.brand-logo img { display:block; height:40px; width:auto; margin:0 auto; }
  .subtitle { margin:-6px 0 1px; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.4; max-width:340px; }
  #stage {
    position:relative; width:min(92vw, calc((100dvh - 200px) * 9 / 16), 420px);
    aspect-ratio:9 / 16; overflow:hidden; isolation:isolate; container-type:inline-size;
    background:#e7efeb; border-radius:25px;
    box-shadow:0 18px 48px rgba(7,63,73,.18),0 3px 10px rgba(7,63,73,.10);
    outline:1px solid rgba(7,63,73,.12); outline-offset:3px;
  }
  #frameImg, #result { position:absolute; inset:0; width:100%; height:100%; }
  /* Cámara: zona nítida (#camWin; el script fija su alto y posición) y, encima, un lienzo pequeño con la propia cámara
     difuminada y transparente en el centro (#bgCanvas). No hay franjas de color: el marco sigue siendo transparente. */
  /* Cámara en una ventana con esquinas redondeadas y borde blanco, POR ENCIMA del marco: el marco queda alrededor
     (logo arriba, olas abajo y franjas a los lados) y no tapa la imagen. El script fija la posición y el tamaño. */
  #camWin { position:absolute; left:5%; top:16%; width:90%; height:74%; overflow:hidden; z-index:3; background:#fff;
    border-radius:12px; border-radius:calc(var(--rad, 4) * 1cqw + var(--brd, .6) * 1cqw);
    clip-path:inset(0 round calc(var(--rad, 4) * 1cqw + var(--brd, .6) * 1cqw)); }
  #cam { position:absolute; left:3px; top:3px; width:calc(100% - 6px); height:calc(100% - 6px);
    left:calc(var(--brd, .6) * 1cqw); top:calc(var(--brd, .6) * 1cqw);
    width:calc(100% - var(--brd, .6) * 2cqw); height:calc(100% - var(--brd, .6) * 2cqw); object-fit:cover; object-position:50% 25%;
    border-radius:10px; border-radius:calc(var(--rad, 4) * 1cqw); clip-path:inset(0 round calc(var(--rad, 4) * 1cqw)); }
  #cam.mirror { transform:scaleX(-1); }
  #bgCanvas { position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; display:none; }
  #frameImg { pointer-events:none; object-fit:fill; z-index:2; }
  #watermark { position:absolute; z-index:2; width:46%; left:50%; bottom:17%;
    transform:translateX(-50%); pointer-events:none; opacity:.55; }
  #watermark img { display:block; width:100%; height:auto; }
  #previewNote { position:absolute; inset:0; z-index:4; background:#062f36; }
  #previewNote img { width:100%; height:100%; object-fit:contain; display:block; }
  #previewNote p { position:absolute; left:10px; right:10px; bottom:12px; margin:0; padding:9px 11px; border-radius:12px; background:rgba(7,63,73,.9); color:#fff; font-size:.8rem; line-height:1.35; text-align:center; }
  #result { display:none; object-fit:contain; background:#062f36; z-index:3; }
  #countdown {
    position:absolute; z-index:4; top:14px; left:50%; transform:translateX(-50%);
    margin:0; min-width:64px; padding:8px 14px; border:1px solid rgba(255,255,255,.45);
    border-radius:999px; background:rgba(7,63,73,.88); backdrop-filter:blur(10px);
    color:#fff; text-align:center; font-size:.95rem; font-weight:850;
    font-variant-numeric:tabular-nums; box-shadow:0 4px 15px rgba(0,0,0,.16);
  }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:min(100%,380px); }
  button {
    font:inherit; font-size:.94rem; font-weight:800; border:0; border-radius:15px;
    min-height:48px; padding:13px 19px; background:var(--gold); color:var(--blue);
    cursor:pointer; box-shadow:0 5px 14px rgba(7,63,73,.10);
    transition:transform .15s ease,filter .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:active { transform:scale(.98); }
  button.sec { background:rgba(255,255,255,.76); color:var(--blue); border:1px solid rgba(7,63,73,.24); box-shadow:none; }
  button:disabled { opacity:.65; cursor:wait; }
  a.cta { display:inline-flex; align-items:center; justify-content:center; max-width:100%;
    text-align:center; text-decoration:none; white-space:normal; font:inherit; font-size:.94rem;
    font-weight:850; border:0; border-radius:15px; padding:13px 20px; min-height:48px;
    background:var(--green); color:#fff; box-shadow:0 5px 14px rgba(7,63,73,.12); }
  #done { width:min(100%,380px); display:flex; flex-direction:column; align-items:stretch; gap:9px; }
  #done > button, #done > a { width:100%; min-height:48px; }
  #retry { background:var(--blue); color:#fff; }
  #download { background:var(--gold); color:var(--blue); }
  #msg { font-size:.9rem; line-height:1.45; text-align:center; max-width:360px; min-height:1.2em; margin:0; color:var(--blue); }
  .hint { color:var(--muted); font-size:.78rem; margin:-5px 0 0; text-align:center; max-width:360px; line-height:1.4; }
  .privacy-note { color:#718486; font-size:.7rem; text-align:center; max-width:340px; margin:0; line-height:1.4; }
  [hidden] { display:none !important; }
  @media (max-height:720px) {
    body { gap:8px; padding-top:calc(env(safe-area-inset-top) + 9px); }
    .brand-mark { width:30px;height:30px; }
    .brand-name { font-size:1.05rem; }
    #stage { width:min(92vw, calc((100dvh - 170px) * 9 / 16), 420px); }
    .subtitle { font-size:.8rem; }
  }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  /* Panel de diagnóstico: solo aparece con ?debug=1 */
  #debugPanel { width:min(100%,380px); margin-top:6px; padding:10px; border-radius:12px; background:#0b1f24; color:#d7f5e1; }
  #debugPanel .dbg-head { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.8rem; }
  #debugPanel button { min-height:34px; padding:6px 12px; font-size:.78rem; }
  #debugPanel .dbg-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:.78rem; }
  #debugPanel .dbg-row button { min-height:32px; padding:5px 10px; }
  #debugLog { margin:8px 0 0; max-height:260px; overflow:auto; white-space:pre-wrap; word-break:break-all;
    font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; }
  /* Aviso cuando el permiso de la cámara (o del micrófono) está bloqueado */
  #permAlert { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    background:rgba(6,47,54,.64); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); overflow-y:auto; }
  .perm-card { width:min(100%,400px); max-height:100%; overflow-y:auto; background:var(--paper); border-radius:22px;
    padding:22px 20px 14px; box-shadow:0 24px 60px rgba(0,0,0,.35); color:var(--ink); }
  .perm-icon { width:46px; height:46px; display:block; margin:0 auto 8px; }
  .perm-card h2 { margin:0 0 8px; text-align:center; font-size:1.18rem; line-height:1.2; color:var(--blue); letter-spacing:-.01em; }
  #permIntro { margin:0 0 10px; font-size:.9rem; line-height:1.45; text-align:center; }
  #permSteps { margin:0 0 10px; padding:0 0 0 1.4em; font-size:.9rem; line-height:1.5; }
  #permSteps li { margin:0 0 7px; padding-left:2px; }
  #permSteps b, #permIntro b { color:var(--blue); }
  .perm-note { margin:0 0 12px; font-size:.78rem; line-height:1.4; color:var(--muted); }
  .perm-actions { display:flex; flex-direction:column; gap:8px; }
  .perm-actions button { width:100%; }
  #permRetry { background:var(--green); color:#fff; }
  #permClose { background:transparent; box-shadow:none; color:var(--muted); font-weight:700; min-height:42px; }
</style>
</head>

function clearSessionTimers(s) { if (!s) return; ["tick", "hard", "w1", "w2", "st0", "st1", "st2"].forEach(k => { if (s.t[k]) { clearInterval(s.t[k]); clearTimeout(s.t[k]); s.t[k] = 0; } }); }
function updateCountdown(s) {
  if (s !== cur || s.done || s.stopRequested) return;
  const remaining = Math.max(0, DURATION_MS - (performance.now() - s.startedAt));
  countdown.textContent = Math.ceil(remaining / 1000) + " s";
  if (remaining <= 0) stopRecording(s, true);
}
function stopRecording(s, automatic) {
  if (!s || s !== cur || s.done || s.stopRequested) return;
  s.stopRequested = true;
  s.recordedMs = performance.now() - s.startedAt;
  capturePoster(s);
  clearInterval(s.t.tick); clearTimeout(s.t.hard); s.t.tick = s.t.hard = 0;
  setUi("processing");
  countdown.textContent = "Procesando";
  msg.textContent = automatic ? "Fin de los " + MAX_SECONDS + " segundos. Preparando tu vídeo…" : "Preparando tu vídeo…";
  const rec = s.rec;
  log("stop " + (automatic ? "automático" : "manual") + " · estado=" + (rec && rec.state) + " · trozos=" + s.chunks.length + " · bytes=" + s.bytes + " · " + Math.round(s.recordedMs) + " ms");
  if (!rec || rec.state === "inactive") { finalize(s, "inactivo"); return; }
  try { rec.stop(); } catch (e) { log("rec.stop() lanzó: " + describeError(e)); }
  // Red de seguridad: pase lo que pase con "onstop", la pantalla nunca se queda en "Procesando".
  s.t.w1 = setTimeout(() => nudgeRecorder(s), WATCHDOG_NUDGE_MS);
  s.t.w2 = setTimeout(() => finalize(s, "watchdog"), WATCHDOG_FORCE_MS);
}
function nudgeRecorder(s) {
  if (s.done) return;
  log("watchdog: sin onstop tras " + WATCHDOG_NUDGE_MS + " ms · trozos=" + s.chunks.length + " · cierro las pistas de salida");
  try { if (outputStream) outputStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); } catch (e) {}
}
function onRecorderError(s) {
  if (s.done) return;
  if (!s.stopRequested) stopRecording(s, false); else finalize(s, "error");
}

/* ---------- terminar: del grabador a un MP4 listo ---------- */
function readHead(blob, n) {
  return new Promise(resolve => {
    const t = setTimeout(() => resolve(null), 4000);
    try {
      const fr = new FileReader();
      fr.onload = () => { clearTimeout(t); resolve(new Uint8Array(fr.result)); };
      fr.onerror = () => { clearTimeout(t); resolve(null); };
      fr.readAsArrayBuffer(blob.slice(0, n));
    } catch (e) { clearTimeout(t); resolve(null); }
  });
}
function has4cc(bytes, cc) {
  const a = cc.charCodeAt(0), b = cc.charCodeAt(1), c = cc.charCodeAt(2), d = cc.charCodeAt(3);
  for (let i = 0; i + 4 <= bytes.length; i++) if (bytes[i] === a && bytes[i + 1] === b && bytes[i + 2] === c && bytes[i + 3] === d) return true;
  return false;
}
/* "mp4" = MP4 con H.264 (y AAC) · "mp4-other" = MP4 con otros códecs (VP9, AV1, Opus…) · "webm" · "unknown" */
async function sniffContainer(blob) {
  const b = await readHead(blob, 8192);
  if (!b || b.length < 8) return "unknown";
  const tag = String.fromCharCode(b[4], b[5], b[6], b[7]);
  if (["ftyp", "styp", "moov", "moof", "mdat", "free", "skip", "wide"].indexOf(tag) >= 0) {
    if (has4cc(b, "moov")) {                           // la cabecera (moov) dice qué códecs lleva
      if (has4cc(b, "vp09") || has4cc(b, "av01") || has4cc(b, "vp08") || has4cc(b, "Opus")) return "mp4-other";
    }
    return "mp4";
  }
  if (b[0] === 0x1A && b[1] === 0x45 && b[2] === 0xDF && b[3] === 0xA3) return "webm";
  return "unknown";
}
function withTimeout(promise, ms, tag) {
  let timer;
  const guard = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(tag)), ms); });
  promise.catch(() => {});
  return Promise.race([promise, guard]).finally(() => clearTimeout(timer));
}
async function finalize(s, reason) {
  if (!s || s.done) return;
  s.done = true;
  clearSessionTimers(s);
  if (!s.recordedMs) s.recordedMs = performance.now() - s.startedAt;
  const chunks = s.chunks; s.chunks = [];
  const type = ((s.rec && s.rec.mimeType) || s.plan.mime || (chunks[0] && chunks[0].type) || "").toLowerCase();
  log("finalize(" + reason + ") · trozos=" + chunks.length + " · bytes=" + s.bytes + " · tipo=" + (type || "?") + " · " + Math.round(s.recordedMs) + " ms");
  try { if (s.rec) { s.rec.ondataavailable = null; s.rec.onstop = null; s.rec.onerror = null; } } catch (e) {}
  releaseMedia();                                      // la cámara se libera SIEMPRE
  setUi("processing");
  countdown.textContent = "Procesando";
  msg.textContent = "Preparando tu vídeo…";
  let converting = false;
  try {
    const raw = new Blob(chunks, { type: type || "application/octet-stream" });
    if (!raw.size) return failProcessing("empty", "No se generó el vídeo en este dispositivo.");
    const container = await sniffContainer(raw);
    log("contenedor detectado: " + container + " · " + raw.size + " B");
    converting = container !== "mp4";
    const job = converting ? convertToMp4(raw, s, container === "mp4-other" ? "input.mp4" : "input.webm") : Promise.resolve(new Blob([raw], { type: "video/mp4" }));
    const out = await withTimeout(job, converting ? CONVERT_LIMIT_MS : NATIVE_LIMIT_MS, "timeout");
    if (!out || !out.size) return failProcessing("empty", "El vídeo salió vacío.");
    if (converting && await sniffContainer(out) !== "mp4") return failProcessing("error", "El archivo convertido no es un MP4 válido.");
    if (out.size > MAX_BYTES) {
      bitrateScale = Math.max(0.35, bitrateScale * 0.5);
      return failProcessing("size", "El vídeo pesa " + mb(out.size) + " y el máximo permitido es 19 MB.");
    }
    if (out.size > SOFT_BYTES) bitrateScale = Math.max(0.5, bitrateScale * 0.6);
    showDone(out, s, reason);
  } catch (e) {
    log("finalize falló: " + describeError(e));
    if (converting) {
      resetFFmpeg();
      failProcessing(e && e.message === "timeout" ? "timeout" : "convert",
        "No se pudo convertir el vídeo a MP4. Comprueba tu conexión y vuelve a grabar, o abre la página en Safari actualizado.");
    } else {
      failProcessing("error", "No se pudo preparar el vídeo en este dispositivo.");
    }
  }
}
function failProcessing(code, text) {
  log("FALLO[" + code + "] " + text);
  const before = attemptLevel;
  let usedPlain = false;
  if (code !== "size") {
    if (webAudioStepAvailable()) { useWebAudioStep(); usedPlain = true; }
    else if (IS_WEBKIT && !plainMp4 && attemptLevel === 0 && supports("video/mp4")) { plainMp4 = true; savePlain(); usedPlain = true; }
    else { attemptLevel = Math.min(2, attemptLevel + 1); saveLevel(attemptLevel); }
  }
  releaseMedia(); videoBlob = null; outFile = null; canShareFile = false;
  setUi("failed");
  let next;
  if (code === "size") next = "Pulsa «Activar cámara» y graba de nuevo: esta vez se usará menos calidad.";
  else if (usedPlain) next = "Pulsa «Activar cámara» y graba otra vez: ajustamos la grabación para tu teléfono.";
  else if (before >= 2) next = "Pulsa «Activar cámara» para intentarlo otra vez. Si sigue fallando, avisa al equipo del stand.";
  else if (attemptLevel === 1) next = "Pulsa «Activar cámara» y graba otra vez: esta vez usaremos un modo alternativo (puede tardar un poco más).";
  else next = "Pulsa «Activar cámara» y graba otra vez: esta vez se grabará sin sonido para evitar el bloqueo.";
  msg.textContent = text + " " + next;
}
function showPreviewNote() {                      // el navegador no puede reproducir la vista previa: se confirma que el vídeo SÍ se grabó
  if ($("done").hidden || !videoBlob || !cur) return;
  const secs = Math.max(1, Math.min(MAX_SECONDS, Math.round((cur.recordedMs || 0) / 1000)));
  if (cur.posterUrl) { previewPoster.src = cur.posterUrl; previewPoster.hidden = false; } else previewPoster.hidden = true;
  previewText.textContent = "✔ Tu vídeo se grabó (" + secs + " s · " + mb(videoBlob.size) + "). Este navegador no puede mostrarlo aquí, pero está listo: guárdalo con el botón 2.";
  previewNote.hidden = false;
}
function fileName() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "isola-10-aniversario-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".mp4";
}
function showDone(blob, s, reason) {
  if (resultUrl) { try { URL.revokeObjectURL(resultUrl); } catch (e) {} }
  videoBlob = blob; resultUrl = URL.createObjectURL(blob);
  try { outFile = new File([blob], fileName(), { type: "video/mp4", lastModified: Date.now() }); } catch (e) { outFile = null; }
  try { canShareFile = !!(outFile && navigator.share && navigator.canShare && navigator.canShare({ files: [outFile] })); } catch (e) { canShareFile = false; }
  shareBroken = false;
  result.preload = "metadata";
  previewNote.hidden = true;
  if (s && s.posterUrl) result.poster = s.posterUrl; else result.removeAttribute("poster");
  // Sin autoplay: nunca bloquea el flujo. En iPhone la dirección va sin «#t=0.001» (Safari no lo admite bien en vídeos
  // creados en la propia página) y la imagen fija hace de portada; en los demás dispositivos todo sigue igual.
  result.src = IS_IOS ? resultUrl : resultUrl + "#t=0.001";
  setUi("done");
  $("download").textContent = "2. Descarga el video";
  const size = " (" + mb(blob.size) + ")";
  msg.textContent = "¡Vídeo listo!" + size + " Sigue los pasos para guardar y subir tu vídeo.";
  log("LISTO · " + blob.size + " B · razón=" + reason + " · compartir archivos=" + canShareFile + " · " + Math.round(s.recordedMs) + " ms grabados");
  if (DEBUG) try {                                     // solo para el diagnóstico: duración que ve el navegador
    const probe = document.createElement("video"); probe.preload = "metadata"; probe.muted = true;
    probe.onloadedmetadata = () => { log("duración del archivo según el navegador: " + probe.duration + " s · " + probe.videoWidth + "×" + probe.videoHeight); probe.removeAttribute("src"); };
    probe.onerror = () => log("el navegador no pudo leer el archivo para medir su duración");
    probe.src = resultUrl;
  } catch (e) {}
}

/* ---------- conversión WebM → MP4 (solo navegadores sin MP4 nativo) ---------- */
const FFMPEG_SOURCES = [
  { name: "local", js: "ffmpeg/ffmpeg.min.js", core: "ffmpeg/ffmpeg-core.js" },
  { name: "jsdelivr", js: "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js", core: "https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js" }
];
const FF_ARGS = ["-t", String(DURATION_MS / 1000), "-c:v", "libx264", "-preset", "ultrafast", "-crf", "25",
  "-maxrate", "3500k", "-bufsize", "7000k", "-pix_fmt", "yuv420p", "-vsync", "cfr", "-r", "30",
  "-c:a", "aac", "-b:a", "96k", "-movflags", "+faststart", "output.mp4"];
const absUrl = u => new URL(u, document.baseURI).href;
function prefetchConverter() {       // descarga el conversor en segundo plano mientras la persona se encuadra
  if (prefetchStarted) return; prefetchStarted = true;
  if (navigator.connection && navigator.connection.saveData) return;
  (async () => {
    for (const src of FFMPEG_SOURCES) {
      try {
        const res = await fetch(absUrl(src.core).replace(/ffmpeg-core\.js$/, "ffmpeg-core.wasm"), { cache: "force-cache" });
        if (!res.ok) continue;
        if (res.body && res.body.getReader) { const rd = res.body.getReader(); for (;;) { const r = await rd.read(); if (r.done) break; } }
        else await res.arrayBuffer();
        log("conversor precargado (" + src.name + ")"); return;
      } catch (e) { /* probamos la siguiente fuente */ }
    }
  })();
}
function loadScriptOnce(url) {
  return new Promise((resolve, reject) => {
    if (window.FFmpeg && window.FFmpeg.createFFmpeg) { resolve(); return; }
    const sc = document.createElement("script"); sc.src = url; sc.crossOrigin = "anonymous";
    sc.onload = () => (window.FFmpeg && window.FFmpeg.createFFmpeg) ? resolve() : reject(new Error("FFmpeg no se inicializó"));
    sc.onerror = () => { sc.remove(); reject(new Error("no se pudo descargar " + url)); };
    document.head.appendChild(sc);
  });
}
function getFFmpeg(onStatus) {       // si falla, NO se guarda el error: el siguiente intento vuelve a empezar
  if (!ffmpegPromise) {
    const p = (async () => {
      let last = null;
      for (const src of FFMPEG_SOURCES) {
        try {
          if (onStatus) onStatus("Descargando el conversor de vídeo… (solo la primera vez)");
          await loadScriptOnce(absUrl(src.js));
          const api = window.FFmpeg;
          const instance = api.createFFmpeg({ log: false, mainName: "main", corePath: absUrl(src.core) });
          await instance.load();
          log("ffmpeg listo (" + src.name + ")");
          return { instance, fetchFile: api.fetchFile };
        } catch (e) { last = e; log("ffmpeg (" + src.name + ") falló: " + describeError(e)); }
      }
      throw last || new Error("no se pudo cargar el conversor");
    })();
    ffmpegPromise = p;
    p.catch(() => { if (ffmpegPromise === p) ffmpegPromise = null; });
  }
  return ffmpegPromise;
}
async function resetFFmpeg() {       // tras un fallo o timeout se descarta la instancia (libera memoria)
  const p = ffmpegPromise; ffmpegPromise = null;
  if (!p) return;
  try { const { instance } = await p; try { instance.exit(); } catch (e) {} } catch (e) {}
}
async function convertToMp4(inputBlob, s, inputName) {
  msg.textContent = "Convirtiendo el vídeo a MP4 en este dispositivo… no cierres la página.";
  const { instance: ff, fetchFile } = await getFFmpeg(text => { msg.textContent = text; });
  msg.textContent = "Convirtiendo el vídeo a MP4 en este dispositivo… no cierres la página.";
  const total = Math.max(1, Math.min(MAX_SECONDS, (s.recordedMs || DURATION_MS) / 1000));
  try { ff.FS("unlink", inputName); } catch (e) {}
  try { ff.FS("unlink", "output.mp4"); } catch (e) {}
  ff.setLogger(({ message }) => {
    const m = /time=(\d+):(\d+):(\d+(?:\.\d+)?)/.exec(message || "");
    if (m) { const t = (+m[1]) * 3600 + (+m[2]) * 60 + parseFloat(m[3]); countdown.textContent = "Convirtiendo " + Math.round(Math.min(0.99, t / total) * 100) + " %"; }
  });
  ff.FS("writeFile", inputName, await fetchFile(inputBlob));
  await ff.run("-i", inputName, ...FF_ARGS);
  let data;
  try { data = ff.FS("readFile", "output.mp4"); } catch (e) { throw new Error("ffmpeg no generó el MP4"); }
  const out = new Blob([data], { type: "video/mp4" });
  try { ff.FS("unlink", inputName); ff.FS("unlink", "output.mp4"); } catch (e) {}
  ff.setLogger(() => {});
  resetFFmpeg();                                       // libera la memoria del conversor (la próxima vez se recarga desde la caché)
  return out;
}

/* ---------- guardar y compartir ---------- */
function downloadFile() {
  const url = URL.createObjectURL(videoBlob);
  const a = document.createElement("a");
  a.href = url; a.download = outFile ? outFile.name : fileName(); a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  msg.textContent = IS_IOS
    ? "Archivo descargado. Ábrelo en «Archivos» → «Descargas»; para tenerlo en Fotos toca Compartir → «Guardar video». Después pulsa «3»."
    : "Descarga iniciada. Comprueba la carpeta de descargas de tu dispositivo y después pulsa «3» para subirlo.";
}
function onDownload() {
  if (!videoBlob) { msg.textContent = "Primero graba un vídeo."; return; }
  if (false) {   // r12: en todos los teléfonos (también iPhone) se descarga directo a «Descargas», como en la versión d9
    // (antes, en iPhone: hoja de compartir con «Guardar video» → Fotos).
    // Debe llamarse de forma síncrona dentro del toque; por eso el archivo ya está preparado.
    let p;
    try { p = navigator.share({ files: [outFile] }); } catch (e) { p = Promise.reject(e); }
    msg.textContent = "En el menú que se abre, elige «Guardar video» para guardarlo en Fotos.";
    Promise.resolve(p).then(() => {
      log("share: completado");
      msg.textContent = "Listo. Si elegiste «Guardar video», ya está en Fotos. Ahora pulsa «3» para subirlo y sumar puntos.";
    }, err => {
      log("share: " + describeError(err));
      if (err && err.name === "AbortError") { msg.textContent = "No se guardó el vídeo. Pulsa «2» otra vez y elige «Guardar video»."; return; }
      shareBroken = true;
      msg.textContent = "No se pudo abrir el menú de compartir. Pulsa «2» otra vez para descargar el archivo.";
    });
    return;
  }
  downloadFile();
}

/* ---------- repetir ---------- */
function retry() {
  if (resultUrl) { try { URL.revokeObjectURL(resultUrl); } catch (e) {} resultUrl = null; }
  try { result.pause(); } catch (e) {}
  previewNote.hidden = true; result.removeAttribute("poster");
  while (posterUrls.length) { try { URL.revokeObjectURL(posterUrls.pop()); } catch (e) {} }
  result.removeAttribute("src"); try { result.load(); } catch (e) {}
  videoBlob = null; outFile = null; canShareFile = false;
  setUi("idle");
  msg.textContent = "Abriendo la cámara para grabar otro vídeo…";
  startCam();
}

/* ---------- eventos ---------- */
result.addEventListener("error", () => {           // solo ante un error real del reproductor (no por tiempo: iPhone no precarga los vídeos)
  if ($("done").hidden || !resultUrl) return;
  const er = result.error; log("vista previa: error " + (er ? er.code + " " + (er.message || "") : "?"));
  showPreviewNote();
});
result.addEventListener("loadedmetadata", () => { if (resultUrl) log("vista previa: " + result.videoWidth + "×" + result.videoHeight + " · " + (isFinite(result.duration) ? result.duration.toFixed(1) + " s" : "duración ?")); });
cam.addEventListener("loadedmetadata", applyPreviewLayout);
cam.addEventListener("resize", applyPreviewLayout);
$("start").onclick = startCam;
$("record").onclick = startRecording;
$("stop").onclick = () => stopRecording(cur, false);
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("download").onclick = onDownload;
$("retry").onclick = retry;
window.addEventListener("pagehide", releaseMedia);
document.addEventListener("visibilitychange", () => { if (cur && !cur.done) log("visibilidad: " + document.visibilityState); });
// Si el navegador ya sabe que la cámara está bloqueada, se avisa antes de que la persona lo intente.
permissionState("camera").then(st => {
  log("permiso de cámara al abrir la página: " + st);
  if (st === "denied" && !stream && !camBusy) msg.textContent = "La cámara está bloqueada para esta página. Pulsa «Activar cámara» y te explicamos cómo activarla.";
});

/* ---------- panel de diagnóstico (solo con ?debug=1) ---------- */
log("build " + BUILD + " · " + location.pathname);
if (DEBUG) {
  $("debugPanel").hidden = false;
  $("debugPanel").querySelector("strong").textContent = "Diagnóstico · " + BUILD;
  log("UA: " + UA);
  log("micrófono por procesador de audio (recordado en esta visita)=" + useWebAudio);
  log("iOS=" + IS_IOS + " · memoria≈" + (navigator.deviceMemory || "?") + " GB · núcleos=" + (navigator.hardwareConcurrency || "?") + " · pantalla " + screen.width + "×" + screen.height + " @" + (window.devicePixelRatio || 1));
  log("soporte MediaRecorder → " + [].concat(MP4_TYPES, WEBM_TYPES).map(t => (supports(t) ? "SÍ " : "no ") + t).join(" | "));
  log("compartir archivos: share=" + !!navigator.share + " canShare=" + !!navigator.canShare + " · nivel guardado=" + attemptLevel);
  try { if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => log("almacenamiento: usado " + mb(e.usage || 0) + " de " + mb(e.quota || 0))); } catch (e) {}
  // Comparar encuadres en vivo, sin tocar el código: cada botón cambia CAMERA_MAX_ASPECT solo en esta pantalla.
  try { $("dbgWin").hidden = true; } catch (e) {}       // r9: la ventana es fija; estos botones ya no aplican
  const winBtns = Array.prototype.slice.call(document.querySelectorAll("#dbgWin button"));
  const markWin = () => winBtns.forEach(b => { b.style.outline = (Math.abs(parseFloat(b.dataset.win) - maxAspect()) < 0.0005) ? "2px solid #f0b323" : "none"; });
  winBtns.forEach(b => { b.onclick = () => {
    if (canvasCtx) { msg.textContent = "Cambia el encuadre antes de grabar o después de terminar."; return; }
    winOverride = parseFloat(b.dataset.win); lastLayoutKey = ""; applyPreviewLayout(); markWin();
    log("encuadre de prueba: CAMERA_MAX_ASPECT = " + winOverride);
  }; });
  markWin();
  $("dbgCopy").onclick = () => {
    const text = logLines.join("\n"), done = () => { $("dbgCopy").textContent = "¡Copiado!"; setTimeout(() => { $("dbgCopy").textContent = "Copiar log"; }, 2000); };
    const legacy = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); };
    try { navigator.clipboard.writeText(text).then(done, legacy); } catch (e) { legacy(); }
  };
}
</script>
